name: build-installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # 仓库未提交平台目录，先由 CI 生成（不覆盖 lib/ 与 pubspec）
      - name: Generate platform folders
        run: flutter create --org com.wordlab --project-name ciji --platforms=android,ios,windows .
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Build setup.exe
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc installer\wordease.iss
      - uses: actions/upload-artifact@v4
        with:
          name: ciji-windows-setup
          path: outputs/CijiSetup-*.exe
          if-no-files-found: error

  apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folders
        run: flutter create --org com.wordlab --project-name ciji --platforms=android,ios,windows .
      - run: flutter pub get
      # ML Kit R8 需要可选语言类，官方做法：追加 4 个语言依赖（保留 minify）
      - name: Add ML Kit language deps
        shell: bash
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            printf '%s\n' '' 'dependencies {' '    implementation("com.google.mlkit:text-recognition-chinese:16.0.1")' '    implementation("com.google.mlkit:text-recognition-devanagari:16.0.1")' '    implementation("com.google.mlkit:text-recognition-japanese:16.0.1")' '    implementation("com.google.mlkit:text-recognition-korean:16.0.1")' '}' >> android/app/build.gradle.kts
            echo "kts deps appended"
          fi
          if [ -f android/app/build.gradle ]; then
            printf '%s\n' '' 'dependencies {' "    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'" "    implementation 'com.google.mlkit:text-recognition-devanagari:16.0.1'" "    implementation 'com.google.mlkit:text-recognition-japanese:16.0.1'" "    implementation 'com.google.mlkit:text-recognition-korean:16.0.1'" '}' >> android/app/build.gradle
            echo "groovy deps appended"
          fi
          tail -n 12 android/app/build.gradle.kts 2>/dev/null || tail -n 12 android/app/build.gradle
      - name: Build APK (release)
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: ciji-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    name: iOS IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folders
        run: flutter create --org com.wordlab --project-name ciji --platforms=android,ios,windows .
      - run: flutter pub get
      # ML Kit 要求 iOS 15.5+：Podfile 无 platform 行则追加，并把工程部署目标提到 15.5
      - name: Patch iOS deployment target
        shell: bash
        run: |
          grep -q "^platform :ios" ios/Podfile || printf "\nplatform :ios, '15.5'\n" >> ios/Podfile
          sed -i '' "s/^platform :ios, .*/platform :ios, '15.5'/" ios/Podfile
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.5;/g' ios/Runner.xcodeproj/project.pbxproj
      # 未签名 IPA：--no-codesign 只出 xcarchive，手动把 Runner.app 打进 Payload 生成 ipa（可用爱思助手等自签安装）
      - name: Build IPA (unsigned)
        run: |
          flutter build ipa --release --no-codesign
          mkdir -p Payload
          cp -R build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app Payload/
          mkdir -p build/ios/ipa
          zip -q -r -y build/ios/ipa/Runner.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ciji-ios-ipa
          path: build/ios/ipa/Runner.ipa
          if-no-files-found: error

  release:
    name: Attach to GitHub Release
    needs: [windows, ios, apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ciji-windows-setup
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: ciji-ios-ipa
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: ciji-android-apk
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          draft: false
          prerelease: false